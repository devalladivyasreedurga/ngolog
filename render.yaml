# Render Blueprint. The API and database are paid on purpose: the API must not sleep
# (PayPal webhooks) and the database must not expire before judging ends (Dec 15).
# The web app is free. Prices checked on render.com/pricing 2026-11-10: web $7/mo,
# Postgres $6/mo, disk $0.25/GB/mo. If Render rejects a plan name, use the new-style
# ids shown on its pricing page (e.g. 0.5c-512mb, 0.1c-256mb).
databases:
  - name: ngolog-db
    plan: basic-256mb
    databaseName: ngolog
    user: ngolog

services:
  - type: web
    name: ngolog-api
    runtime: python
    plan: starter
    buildCommand: pip install ./backend
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:  # evidence uploads must survive deploys
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: ngolog-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: REVIEWER_EMAILS
        value: reviewer@ngolog.org
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS  # the ngolog-web URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false

  - type: web
    name: ngolog-web
    runtime: node
    plan: free  # sleeps when idle (slow first visit); the API and database stay on paid plans
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL  # the ngolog-api URL; read at build time
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
