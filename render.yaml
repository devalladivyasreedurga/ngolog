# Render Blueprint, free plans only (no card needed). Database: Neon free Postgres
# (neon.com), pasted in as DATABASE_URL, because Render's free databases expire.
#
# Free-plan behavior to know about:
# - Services sleep after ~15 min idle; the first request then takes up to a minute.
# - The disk is wiped on every sleep/redeploy, so uploaded evidence FILES disappear.
#   Extracted receipt values, claims and checks live in Postgres and are kept.
# - The in-app scheduler only runs while the API is awake; reviewers can run the jobs
#   from the console (POST /api/accountability/run-jobs).
services:
  - type: web
    name: ngolog-api
    runtime: python
    plan: free
    buildCommand: pip install ./backend
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL  # Neon connection string (direct, not pooled)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: REVIEWER_EMAILS
        value: reviewer@ngolog.org
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS  # the ngolog-web URL, no trailing slash
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: ngolog-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL  # the ngolog-api URL; baked in at build time, redeploy after changing
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
