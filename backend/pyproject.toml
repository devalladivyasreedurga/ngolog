[project]
name = "ngolog-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "anthropic>=2.4",
    "langgraph>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
